<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagina de productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<h1 class="text-center"><Base></Base>ALUMNOS</h1>
<a href="/tablaAlumnos/exportar" class="btn btn-primary">EXPORTAR EXCEL</a>
<a href=".." class="btn btn-primary">VOLVER</a>
<table class="table">
    <thead>
    <tr>
        <th>ID</th>
        <th>NOMBRE</th>
        <th>APELLIDO</th>
        <th>TELEFONO</th>
        <th>EMAIL</th>
        <th>AREA DE PREFERENCIA</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="alumno : ${alumnos}">
        <td th:text="${alumno.idALumno}"></td>
        <td th:text="${alumno.nombre}"></td>
        <td th:text="${alumno.apellido}"></td>
        <td th:text="${alumno.telefono}"></td>
        <td th:text="${alumno.mail}"></td>
        <td th:text="${alumno.areaRecomendada}"></td>
        <td style="white-space:nowrap">
            <a class="btn btn-primary btn-sm" th:href="@{/tablaAlumnos/edit/{id}(id=${alumno.idALumno})}">Editar</a>
            <form th:action="@{/tablaAlumnos/delete/{id}(id=${alumno.idALumno})}" method="post" onsubmit="return confirm('¿Estás seguro de que deseas eliminar este producto?');">
                <input type="hidden" name="_method" value="DELETE"/>
                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
