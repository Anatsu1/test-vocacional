<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #343a40;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-primary, .btn-success, .btn-secondary, .btn-danger {
            font-size: 0.9rem;
        }
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }
        .table th {
            background-color: #007bff;
            color: #ffffff;
            font-weight: 600;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="table-container">
        <h1>Alumnos Registrados</h1>

        <div class="d-flex justify-content-between mb-3">
            <a href="/tablaAlumnos/exportar" class="btn btn-success">Exportar a Excel</a>
            <a href=".." class="btn btn-secondary">Volver</a>
        </div>

        <table class="table table-hover table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Área de Preferencia</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="alumno : ${alumnos}">
                <td th:text="${alumno.idALumno}"></td>
                <td th:text="${alumno.nombre}"></td>
                <td th:text="${alumno.apellido}"></td>
                <td th:text="${alumno.telefono}"></td>
                <td th:text="${alumno.mail}"></td>
                <td th:text="${alumno.areaRecomendada}"></td>
                <td class="actions">
                    <div class="btn-group">
                        <a class="btn btn-primary btn-sm" th:href="@{/tablaAlumnos/edit/{id}(id=${alumno.idALumno})}">Editar</a>
                        <form th:action="@{/tablaAlumnos/delete/{id}(id=${alumno.idALumno})}" method="post" onsubmit="return confirm('¿Estás seguro de que deseas eliminar este alumno?');" class="d-inline-block">
                            <input type="hidden" name="_method" value="DELETE"/>
                            <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
